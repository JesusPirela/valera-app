name: Typecheck

# Red de seguridad: corre `tsc --noEmit` en cada push y PR para que no se
# cuelen errores de tipo a main (que despliega solo). No compila ni despliega
# nada; solo verifica tipos.
on:
  push:
  pull_request:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
