name: Prueba de humo

# ¿La app ARRANCA?
#
# El deploy ya construye la web, así que un import roto o un error de sintaxis
# no llegan a producción. Lo que sí llega es un crash de RENDER: el bundle se
# construye perfecto y la pantalla revienta al montarse. Pasó con "Cannot read
# properties of null (reading 'tipo_operacion')", que dejaba a la gente sin CRM
# y nadie se enteró hasta revisar el monitoreo semanas después.
#
# Esto construye la web, la sirve y la abre en un navegador de verdad para
# comprobar que monta y pinta. No inicia sesión: con llegar a la pantalla de
# login ya se ejercita el bundle entero, el arranque de React, el router y la
# creación del cliente de Supabase.
#
# Va en su propio archivo y NO bloquea el deploy, que corre por separado.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: humo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  humo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx expo export --platform web --clear
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      # Sin --save: playwright es solo para esta comprobación y no tiene por qué
      # engordar package.json ni alargar el npm ci del deploy.
      - name: Instalar navegador
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Arranque de la app
        run: node scripts/smoke-web.mjs
